[library]
name = "@lam/vulture/dev-plugin"
version = "1.0.0"
description = "Development helpers for @lam/vulture: browser live reload for lamc dev"
license = "Apache-2.0"
authors = ["Lammergeier contributors"]
homepage = "https://github.com/thallium-solutions/lam-vulture-dev-plugin"
repository = "https://github.com/thallium-solutions/lam-vulture-dev-plugin"

[compatibility]
lamc = ">=4.0, <5"

[dependencies]
"@lam/vulture" = { git = "https://github.com/thallium-solutions/lam-vulture.git", ref = "3.6.0" }

[scripts]
test = "python3 tests/run_tests.py"
format = "lamc fmt ."
check = "lamc fmt . --check"
